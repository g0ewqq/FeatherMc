[package]
name = "spironmc"
version = "0.1.0"
edition = "2021"
description = "SpironMC — a from-scratch Minecraft server written in Rust"
readme = "README.md"
rust-version = "1.74"

[[bin]]
name = "spironmc"
path = "src/main.rs"

[lib]
name = "spironmc"
path = "src/lib.rs"

[dependencies]
ctrlc = "3.4"
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = { version = "0.8", features = ["parse", "display"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3.12"
